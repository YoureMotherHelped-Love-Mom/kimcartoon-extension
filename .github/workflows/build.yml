name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          platforms-version: "35"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Prepare Repository
        run: |
          mkdir -p repo-output/apk
          apk_path=$(find . -path "*/build/outputs/apk/release/*.apk" -type f | head -1)
          cp "$apk_path" "repo-output/apk/eu.kanade.tachiyomi.extension.all.kimcartoon-v1.0.0.apk"
          cp .github/scripts/create-repo.py repo-output/

      - name: Generate Index
        working-directory: repo-output
        run: python3 create-repo.py

      - name: Clean up Script
        run: rm repo-output/create-repo.py

      - name: Deploy to repo branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: repo
          folder: repo-output
          clean: true
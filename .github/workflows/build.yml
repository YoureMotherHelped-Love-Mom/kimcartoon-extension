name: Build and Deploy

on:
  push:
    branches:
      - main
      - master # Support both common default branch names

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleRelease

      - name: Prepare Repository
        run: |
          mkdir -p repo-output/apk
          # Find all release APKs and copy them to the output folder
          find . -path "*/build/outputs/apk/release/*.apk" -type f -exec cp {} repo-output/apk/ \;
          # Copy the index generator script to the output folder
          cp .github/scripts/create-repo.py repo-output/

      - name: Generate Index
        working-directory: repo-output
        run: python3 create-repo.py

      - name: Clean up Script
        run: rm repo-output/create-repo.py

      - name: Deploy to 'repo' Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: repo
          folder: repo-output
          clean: true